
# stremio-subsync (127.0.0.1:11480). Access is gated by the secret token in the path, not by a login
# cookie: Stremio fetches addons itself and the streaming engine fetches subtitle files server-side.
location /subsync/ {
    proxy_pass http://127.0.0.1:11480/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 120s;
}
