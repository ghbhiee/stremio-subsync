
# stremio-subsync (127.0.0.1:11480). Access is gated by the secret token in the path, not by a login
# cookie: Stremio fetches addons itself and the streaming engine fetches subtitle files server-side.
location /subsync/ {
    proxy_pass http://127.0.0.1:11480/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 120s;
    proxy_set_header X-Subsync-User "";   # never trust a user name sent by the client
}

# Optional: one vocabulary book per user of your login gateway. The browser calls /subsync/<token>/vocab
# from your site, so its login cookie comes along: let the gateway check it (auth_request) and pass the
# user it reports to the addon, which must then run with VOCAB_USER_HEADER=X-Subsync-User. Without this
# block (and that variable) every browser gets a book of its own instead.
#
